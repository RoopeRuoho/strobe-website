<!doctype html>
<html lang="en">
<head>
  <script src="gate.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strobe Corp | Lighting Designer, Operator, Technician</title>
  <meta name="description" content="Strobe Corp: lighting design, operation and technical services.">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Strobe Corp | Lighting Designer, Operator, Technician">
  <meta property="og:description" content="Strobe Corp: lighting design, operation and technical services.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffb347'/%3E%3C/svg%3E">
  <script>
    /* Restore the saved gel (accent colour) before first paint, so the intro and page start in it. */
    try { var gel = localStorage.getItem("strobe-gel"); if (gel && /^#[0-9a-f]{6}$/i.test(gel)) document.documentElement.style.setProperty("--accent", gel); } catch (e) {}
  </script>
  <script>
    /* Intro gate: runs before first paint so the page never flashes before the blackout. */
    (function () {
      var d = document.documentElement, seen = false, rm = false;
      try { rm = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
      try { seen = sessionStorage.getItem("strobe-intro-seen") === "1"; } catch (e) {}
      if (!rm && !seen) {
        d.classList.add("intro-pending");
        // Safety net: if script.js never starts the intro, show the page anyway.
        setTimeout(function () { if (!window.__introStarted) d.classList.remove("intro-pending"); }, 3000);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Intro: moving head fixture, beam and pool of light. Hidden unless html.intro-pending. -->
  <div class="intro" id="intro">
    <svg class="intro-mask" id="introMask" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="holeGrad">
          <stop offset="0" stop-color="#000"/><stop offset=".86" stop-color="#000"/><stop offset="1" stop-color="#fff"/>
        </radialGradient>
        <mask id="holeMask" maskUnits="userSpaceOnUse" x="-3000" y="-3000" width="9000" height="9000">
          <rect x="-3000" y="-3000" width="9000" height="9000" fill="#fff"/>
          <circle id="hole" r="1" fill="url(#holeGrad)" transform="matrix(.001 0 0 .001 0 0)"/>
        </mask>
      </defs>
      <rect x="-3000" y="-3000" width="9000" height="9000" fill="#050505" mask="url(#holeMask)"/>
    </svg>
    <div class="intro-glow" id="introGlow" aria-hidden="true"></div>

    <!-- Line-art rig drawn by script.js: roof truss plus three spot moving heads. Only the centre spot starts lit. -->
    <svg class="fixture" id="fixture" aria-hidden="true" focusable="false">
      <defs id="fxDefs">
        <mask id="holeMaskFx" maskUnits="userSpaceOnUse" x="-3000" y="-3000" width="9000" height="9000">
          <rect x="-3000" y="-3000" width="9000" height="9000" fill="#fff"/>
          <circle id="holeFx" r="1" fill="url(#holeGrad)" transform="matrix(.001 0 0 .001 0 0)"/>
        </mask>
        <!-- everything that is not a lit spot is in the dark: it only shows inside a beam (plus a faint ambient trace) -->
        <mask id="darkMask" maskUnits="userSpaceOnUse" x="-3000" y="-3000" width="9000" height="9000">
          <rect x="-3000" y="-3000" width="9000" height="9000" fill="#030303"/>
          <g id="maskBeams"></g>
        </mask>
        <!-- the truss is only slightly visible in the dark; beams still light it up clearly -->
        <mask id="trussMask" maskUnits="userSpaceOnUse" x="-3000" y="-3000" width="9000" height="9000">
          <rect id="trussAmb" x="-3000" y="-3000" width="9000" height="9000" fill="#2a2a2a"/>
          <g id="maskBeams2"></g>
        </mask>
        <radialGradient id="lensGlow">
          <stop offset="0" style="stop-color: var(--accent); stop-opacity: .7"/>
          <stop offset=".6" style="stop-color: var(--accent); stop-opacity: .3"/>
          <stop offset="1" style="stop-color: var(--accent); stop-opacity: .1"/>
        </radialGradient>
      </defs>
      <g class="fx" id="fxTruss" mask="url(#trussMask)"></g>
      <g class="fx" id="fxDark" mask="url(#darkMask)"></g>
      <g class="fx" id="fxG" mask="url(#holeMaskFx)"></g>
    </svg>

    <svg class="intro-beam" id="introBeam" aria-hidden="true" focusable="false">
      <defs id="beamDefs">
        <radialGradient id="lensLightGrad">
          <stop offset="0" stop-color="#fff1d2" stop-opacity=".96"/>
          <stop offset=".7" style="stop-color: var(--accent)" stop-opacity=".94"/>
          <stop offset="1" style="stop-color: var(--accent)" stop-opacity=".9"/>
        </radialGradient>
      </defs>
      <!-- the whole lens glass is lit evenly; the beam is born from it -->
      <circle id="lensLight" r="1" fill="url(#lensLightGrad)" transform="matrix(.001 0 0 .001 0 0)"/>
    </svg>

    <div class="intro-vignette" id="introVignette" aria-hidden="true"></div>

    <button class="spot-hit" id="spotC" type="button" aria-pressed="true" aria-label="Switch the centre spot off"></button>
    <button class="spot-hit" id="spotL" type="button" aria-pressed="false" aria-label="Switch on the left spot"></button>
    <button class="spot-hit" id="spotR" type="button" aria-pressed="false" aria-label="Switch on the right spot"></button>

    <button class="intro-skip" id="introSkip" type="button">Skip intro</button>
    <button class="intro-enter" id="introEnter" type="button">Enter the light</button>
  </div>

  <div id="stage">
  <header class="site-header">
    <a class="logo" href="#hero" id="logo"></a>
    <!-- TEMP: dev helper to replay the intro. Remove this button, its CSS (.replay-temp) and its handler in script.js before launch. -->
    <button class="replay-temp" id="replayTemp" type="button">Replay intro</button>
    <!-- TEMP: dev link to the admin panel preview. Remove with the button above before launch (and delete admin.* files). -->
    <a class="replay-temp admin-temp" href="admin.html">Admin</a>
    <nav aria-label="Main" id="nav"></nav>
  </header>

  <main id="main" tabindex="-1">
    <section id="hero" class="hero" aria-labelledby="hero-title">
      <p class="cue">CUE 0 / HOUSE LIGHTS</p>
      <h1 id="hero-title" class="hero-title"></h1>
      <p class="hero-role" id="hero-role"></p>
      <p class="hero-tagline" id="hero-tagline"></p>
      <a class="btn" href="#work">See the work</a>
    </section>

    <section id="about" class="section" aria-labelledby="about-title">
      <p class="cue" id="about-cue"></p>
      <h2 id="about-title"></h2>
      <div class="about-grid">
        <div class="prose" id="about-text"></div>
        <dl class="stats" id="about-stats"></dl>
      </div>
      <a class="btn" id="about-more" href="about.html"></a>
    </section>

    <section id="work" class="section" aria-labelledby="work-title">
      <p class="cue" id="work-cue"></p>
      <h2 id="work-title"></h2>
      <!-- Gobo wheel: selected work on a slowly turning wheel -->
      <div class="gobo" id="gobo" role="region" aria-roledescription="carousel">
        <div class="gobo-proj">
          <button type="button" class="gobo-screen" id="goboScreen"><span class="gobo-media" id="goboMedia"><span class="gobo-layer" id="goboLayerA"></span><span class="gobo-layer" id="goboLayerB"></span></span></button>
          <canvas class="gobo-beam" id="goboBeam" aria-hidden="true"></canvas>
        </div>
        <div class="gobo-stage" id="goboStage"><div class="gobo-wheel" id="goboWheel"></div></div>

        <div class="gobo-bar">
          <button type="button" class="gobo-btn" id="goboPrev"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg></button>
          <p class="gobo-cap" id="goboCap" aria-live="off"></p>
          <button type="button" class="gobo-btn" id="goboPlay" aria-pressed="false"></button>
          <button type="button" class="gobo-btn" id="goboNext"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <div class="gobo-enc" id="goboEnc" hidden>
          <span class="gobo-enc-k">Speed</span>
          <div class="enc" id="goboKnob" role="slider" tabindex="0" aria-label="Wheel speed" aria-valuemin="1" aria-valuemax="12" aria-valuenow="5"><i></i></div>
          <output class="gobo-enc-v" id="goboEncV">4.2</output>
        </div>
      </div>
      <div class="filters" id="work-filters" role="group" aria-label="Filter projects"></div>
      <p class="sr-only" id="work-status" role="status" aria-live="polite"></p>
      <ul class="grid" id="work-grid"></ul>
    </section>

    <section id="rig" class="section" aria-labelledby="rig-title">
      <p class="cue" id="rig-cue"></p>
      <h2 id="rig-title"></h2>
      <div class="rig" id="rig-groups"></div>
    </section>

 
    <section id="contact" class="section" aria-labelledby="contact-title">
      <p class="cue" id="contact-cue"></p>
      <h2 id="contact-title"></h2>
      <p class="prose" id="contact-text"></p>
      <table class="patch" id="contact-table">
        <caption class="sr-only">Contact details</caption>
        <thead><tr><th scope="col">Ch</th><th scope="col">Label</th><th scope="col">Value</th></tr></thead>
        <tbody></tbody>
      </table>
      <a class="btn" id="contact-btn" href="#contact"></a>
    </section>
    
    <section id="gel" class="section" aria-labelledby="gel-title">
      <p class="cue" id="gel-cue"></p>
      <h2 id="gel-title"></h2>
      <p class="prose" id="gel-text"></p>
      <div class="swatches" id="gel-swatches" role="group" aria-label="Accent colour"></div>
      <p class="gel-name" id="gel-name" role="status" aria-live="polite"></p>
    </section>

  </main>

  <footer class="site-footer"><p id="footer-text"></p></footer>
  </div><!-- /#stage -->

  <!-- Blackout veil, DMX readout and blackout switch (hidden during the intro) -->
  <div class="blackout-veil" id="veil" aria-hidden="true"></div>
  <div class="console" id="console">
    <p class="dmx" id="dmx" aria-hidden="true">
      <span class="dmx-k" id="dmx-u">U1</span> <span class="dmx-k" id="dmx-c">CH</span> <b id="dmx-ch">001</b>
      <span class="dmx-k">=</span> <b id="dmx-val">000</b>
      <span class="dmx-bar"><i id="dmx-fill"></i></span>
    </p>
    <button class="blackout" id="blackout" type="button" aria-pressed="false">Blackout</button>
  </div>

  <!-- Project lightbox (native dialog: focus trap, Escape and focus return come for free) -->
  <dialog class="lightbox" id="lightbox" aria-labelledby="lb-title">
    <div class="lb-inner">
      <button class="lb-close" id="lb-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="lb-media"><img id="lb-img" src="" alt="" width="800" height="500"></div>
      <div class="lb-info">
        <p class="cue" id="lb-cat"></p>
        <h3 id="lb-title"></h3>
        <dl class="lb-meta" id="lb-meta"></dl>
        <p class="lb-blurb" id="lb-blurb"></p>
        <div class="lb-nav">
          <button id="lb-prev" type="button" aria-label="Previous project">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span id="lb-count"></span>
          <button id="lb-next" type="button" aria-label="Next project">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </dialog>

  <noscript>
    <p class="noscript">Strobe Corp needs JavaScript to show this portfolio. Please enable it, or get in touch directly.</p>
  </noscript>

  <script src="content.js"></script>
  <script src="script.js"></script>
  <script src="countup.js"></script>
</body>
</html>
